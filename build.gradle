subprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    // Built with whatever JDK runs the build, but emitting Java 17 bytecode:
    // the loader has to start on the JVM a player already has installed.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()

        // The loader shows its mod report in a window when a launch had
        // problems. A test suite that opens windows is a test suite nobody runs.
        systemProperty 'java.awt.headless', 'true'
        systemProperty 'octo.noReportWindow', 'true'
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
        // The end-to-end tests compile synthetic mods with the in-process javac.
        jvmArgs '-Xmx1G'

        // One JVM per test class. Mixin's environment is static for the life of
        // the process — configs, applied mixins and class metadata all outlive
        // any single launch — so a suite that boots it in one class and launches
        // again in another is testing the leftovers of the first.
        forkEvery = 1
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
