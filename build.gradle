subprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    // Built with whatever JDK runs the build, but emitting Java 17 bytecode:
    // the loader has to start on the JVM a player already has installed.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
        // The end-to-end tests compile synthetic mods with the in-process javac.
        jvmArgs '-Xmx1G'
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
