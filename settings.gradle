pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()

        // Mixin. The published-to-Central Sponge artifact stopped at 0.8.5 and
        // predates the Java 17+ class files every current mod ships; Fabric's
        // fork is the one mods are actually compiled against.
        maven {
            name = 'FabricMC'
            url = 'https://maven.fabricmc.net/'
            content { includeGroup 'net.fabricmc' }
        }

        // EventBus 7, which Forge from 1.21.6 on — and so every Forge mod for
        // 26.x — builds its mod buses out of.
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
            content { includeModule 'net.minecraftforge', 'eventbus' }
        }
    }
}

rootProject.name = 'octo-loader'

include 'loader'
include 'installer'
