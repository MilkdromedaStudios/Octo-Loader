name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Package the installer
        run: ./gradlew :installer:installerJar

      - name: Smoke-test the built loader
        run: |
          mkdir -p /tmp/smoke/mods
          cd /tmp/smoke
          python3 - <<'PY'
          import json, zipfile
          def jar(name, files):
              with zipfile.ZipFile("mods/" + name, "w") as z:
                  for path, content in files.items():
                      z.writestr(path, content)

          jar("fabric-sample.jar", {"fabric.mod.json": json.dumps({
              "schemaVersion": 1, "id": "fabricsample", "version": "1.0.0",
              "depends": {"minecraft": ">=1.20 <1.21"}})})
          jar("quilt-sample.jar", {"quilt.mod.json": json.dumps({
              "schema_version": 1, "quilt_loader": {"group": "x", "id": "quiltsample",
              "version": "1.0.0", "metadata": {"name": "Quilt Sample"}}})})
          jar("forge-sample.jar", {"META-INF/mods.toml":
              'modLoader="javafml"\nloaderVersion="[47,)"\nlicense="MIT"\n'
              '[[mods]]\nmodId="forgesample"\nversion="1.0.0"\n'})
          jar("neoforge-sample.jar", {"META-INF/neoforge.mods.toml":
              'modLoader="javafml"\nloaderVersion="[21,)"\nlicense="MIT"\n'
              '[[mods]]\nmodId="neosample"\nversion="1.0.0"\n'})
          jar("ancient-sample.jar", {"mcmod.info": json.dumps([{
              "modid": "ancientsample", "version": "1.0.0", "mcversion": "1.7.10"}])})
          jar("lite-sample.litemod", {"litemod.json": json.dumps({
              "name": "litesample", "version": "1.0.0", "mcversion": "1.12.2"})})
          PY
          java -jar "$GITHUB_WORKSPACE"/loader/build/libs/octo-loader-*.jar \
            scan --gameDir /tmp/smoke --modsDir /tmp/smoke/mods --mcVersion 1.20.1 | tee scan.txt
          grep -q "6 of 6 mod(s) would load" scan.txt \
            || { echo "::error::the loader did not accept all six sample mods"; exit 1; }

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ⭐ Upload ONLY the JARs — not directories
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            installer/build/installer/installer.jar
            loader/build/libs/octo-loader-*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      # ⭐ Only checksum JARs, not directories
      - name: Generate checksums
        run: |
          cd release
          sha256sum *.jar > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Octo Loader ${{ needs.build.outputs.version }}
          files: |
            release/*.jar
            release/checksums.txt
          draft: false
          prerelease: false
