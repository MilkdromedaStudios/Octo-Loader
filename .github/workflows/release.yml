name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: octo-loader
          path: dist

      - name: Flatten jars for release
        run: |
          mkdir release
          find dist -name "*.jar" -exec cp {} release/ \;
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Octo Loader ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release/*.jar
            release/checksums.txt
          body: |
            One loader for Fabric, Quilt, Forge and NeoForge mods — and for mods
            built for a Minecraft version other than the one you are running.

            ## Install

            Download `installer.jar` and double-click it, or:

            ```bash
            java -jar installer.jar client --mcVersion 1.20.1
            java -jar installer.jar server --dir /srv/minecraft
            ```

            No network access is needed: the loader is inside the installer.
            Requires Java 17 or newer.

            ## Files

            | File | What it is |
            |---|---|
            | `installer.jar` | the installer — this is the one to download |
            | `octo-loader-${{ steps.version.outputs.version }}.jar` | the loader alone |
            | `checksums.txt` | SHA-256 of both |
