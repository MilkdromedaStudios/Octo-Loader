description = 'Octo Loader runtime — one loader that boots Minecraft and runs Fabric, Quilt, Forge, NeoForge and legacy mods side by side.'

base {
    archivesName = 'octo-loader'
}

dependencies {
    implementation "org.ow2.asm:asm:${rootProject.asm_version}"
    implementation "org.ow2.asm:asm-tree:${rootProject.asm_version}"
    implementation "org.ow2.asm:asm-commons:${rootProject.asm_version}"
    implementation "org.ow2.asm:asm-analysis:${rootProject.asm_version}"
    implementation "com.google.code.gson:gson:${rootProject.gson_version}"
    implementation "com.electronwill.night-config:toml:${rootProject.nightconfig_version}"
    implementation "com.electronwill.night-config:core:${rootProject.nightconfig_version}"

    // Mixin, and the extras library most current mods now assume the loader
    // provides. Both are shaded into the loader jar: mods reference these
    // classes directly, so they have to be the same copy the loader booted.
    implementation "net.fabricmc:sponge-mixin:${rootProject.mixin_version}"
    implementation "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"

    // Upstream API sources are annotated with these; they are not needed at runtime.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    testImplementation "org.ow2.asm:asm-util:${rootProject.asm_version}"
}

// ---------------------------------------------------------------------------
// The merge.
//
// Mods do not link against "a loader" — they link against concrete classes:
// net.fabricmc.api.ModInitializer, net.neoforged.fml.common.Mod, and so on.
// So Octo compiles the upstream sources straight into its own jar and
// implements the missing back half itself (see compat/<ecosystem>). A mod built
// against real Fabric Loader finds the real Fabric interfaces here.
//
// There is one upstream tree, not four. `upstream/octo` is the four projects'
// shipped sources merged into a single source root laid out by package, built
// by scripts/sync-upstreams.py, with provenance recorded in its ORIGINS.md.
// This is not a filing decision: Fabric, Quilt, Forge and NeoForge are four
// answers to one question, and Octo is one answer to it, so the reference
// material for it should also be one thing.
//
// Only the mod-facing surface is imported into the build. The upstream
// bootstrap halves — Knot, ModLauncher, SecureJarHandler, the Quilt plugin
// system — are mutually exclusive by construction: each one wants to own the
// class loader and the game's entrypoint. Octo replaces those with a single
// implementation that all four surfaces sit on top of, which is the only way
// they can share a JVM.
// ---------------------------------------------------------------------------
def upstream = rootProject.layout.projectDirectory.dir('upstream/octo')
def upstreamSources = upstream.dir('src/main/java')

// Sync rather than Copy so that narrowing the imported surface actually removes
// the sources that were dropped, instead of leaving them behind to be compiled.
tasks.register('importUpstreamApi', Sync) {
    description = 'Copies the mod-facing API sources out of the merged upstream tree into the build.'
    into layout.buildDirectory.dir('generated/upstream-api')

    from(upstreamSources) {
        // Fabric's mod-facing half is imported whole, including the version
        // parser, so a mod compiled against Fabric Loader links against Fabric
        // Loader's own classes rather than a lookalike.
        include 'net/fabricmc/api/**'
        include 'net/fabricmc/loader/api/**'
        include 'net/fabricmc/loader/impl/util/version/**'
        include 'net/fabricmc/loader/util/version/**'

        // Quilt's API is entangled with its plugin and virtual-filesystem
        // layers, which Octo replaces outright, so only the leaf types come
        // across; the rest of the contract is implemented in compat/quilt.
        include 'org/quiltmc/loader/api/LanguageAdapterException.java'
        include 'org/quiltmc/loader/api/VersionFormatException.java'

        include 'net/neoforged/fml/common/Mod.java'
    }
}

sourceSets.main.java.srcDir tasks.importUpstreamApi

// The loader jar is self-contained: the launcher profile the installer writes
// puts it on the JVM classpath before any mod exists, so it cannot rely on a
// dependency resolver being present at runtime.
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        // Mixin ships service declarations binding it to LaunchWrapper and
        // ModLauncher. Neither is running here — Octo registers its own service
        // in src/main/resources — and leaving theirs in the jar only gives the
        // service loader failing candidates to try first.
        exclude 'META-INF/services/org.spongepowered.asm.service.*'
        exclude 'META-INF/services/cpw.mods.modlauncher.*'
        exclude 'META-INF/services/org.spongepowered.tools.obfuscation.service.*'
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**'
    exclude 'module-info.class'

    // Upstream licences travel with the upstream code. This is the one place
    // the four projects stay separate in the merged tree: their terms are not
    // interchangeable, so neither are their licence files.
    from(upstream.dir('LICENSES')) { into 'META-INF/licenses' }

    manifest {
        attributes(
                'Main-Class': 'studios.milkdromeda.octo.cli.OctoCli',
                'Implementation-Title': 'Octo Loader',
                'Implementation-Version': project.version,
                'Enable-Native-Access': 'ALL-UNNAMED'
        )

        // Mixin decides which Java compatibility levels it can offer by asking
        // the ASM package for its implementation version. Shading ASM into this
        // jar replaces ASM's manifest with Octo's, so without this section mixin
        // reads Octo's version number as ASM's, concludes it is on ASM 9.0, and
        // refuses every mod whose mixin config asks for JAVA_17 or later — which
        // is all of them.
        attributes([
                'Implementation-Title'  : 'ASM',
                'Implementation-Version': rootProject.asm_version
        ], 'org/objectweb/asm/')
    }
}

tasks.register('printJarPath') {
    def jarFile = tasks.jar.archiveFile
    doLast { println jarFile.get().asFile.absolutePath }
}
